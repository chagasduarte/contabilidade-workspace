<ion-header class="mobile-header">
  <div class="mobile-header__top-bar">
    <div class="mobile-header__brand">
      <ion-icon name="checkmark-done-circle" class="mobile-header__logo-icon" aria-hidden="true"></ion-icon>
      <span class="mobile-header__logo-text">Conta<strong>Perfeita</strong></span>
    </div>
  
    <button
      type="button"
      class="mobile-header__menu-btn"
      (click)="menuClick.emit()"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="menuOpen ? 'Fechar menu' : 'Abrir menu'"
      aria-controls="mobile-extra-navigation"
    >
      <span class="mobile-header__menu-icon" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </span>
      <span class="mobile-header__notification-dot" aria-hidden="true"></span>
    </button>
  </div>

  <!-- Régua horizontal de seleção de meses (só em telas mensais) -->
  @if (showMonthSelector()) {
    <div class="mobile-header__months" role="tablist" aria-label="Mês de referência">
      @for (month of months; track month.id) {
        <button
          type="button"
          class="mobile-header__month-pill"
          [attr.data-month]="month.id"
          [class.mobile-header__month-pill--active]="month.id === selectedMonthId()"
          (click)="selectMonth(month.id)"
          role="tab"
          [attr.aria-selected]="month.id === selectedMonthId()"
        >
          <span>{{ month.label }}</span>
          @if (month.id === selectedMonthId()) {
            <ion-icon name="checkmark-outline" class="mobile-header__check-icon" aria-hidden="true"></ion-icon>
          }
        </button>
      }
    </div>
  }
</ion-header>
