services:
  # ----------------------------------------------------------------------------
  # Banco de Dados Relacional - PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: contabilidade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contabilidade}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_mude_essa_senha_em_producao}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-contabilidade}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - contabilidade-network

  # ----------------------------------------------------------------------------
  # Backend - API Express / Node.js
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: contabilidade-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PORT: 3000
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres_mude_essa_senha_em_producao}
      DB_NAME: ${DB_NAME:-contabilidade}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_token_altere_para_uma_chave_segura_em_producao}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_TEXT_MODEL: ${AI_TEXT_MODEL:-openai/gpt-oss-20b}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - api_uploads:/app/public/uploads
    networks:
      - contabilidade-network

  # ----------------------------------------------------------------------------
  # Frontend - Angular / Ionic SPA servido via Nginx com Proxy Reverso
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: apps/contabilidade-front/Dockerfile
    container_name: contabilidade-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - contabilidade-network

# ------------------------------------------------------------------------------
# Volumes Persistentes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  api_uploads:
    driver: local

# ------------------------------------------------------------------------------
# Rede Privada dos Containers
# ------------------------------------------------------------------------------
networks:
  contabilidade-network:
    driver: bridge

