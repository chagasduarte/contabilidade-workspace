name: Deploy Automático Lorien

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Sincronizar repositório e reiniciar containers
        env:
          # Segredo de assinatura dos tokens; o docker-compose.yml exige (${JWT_SECRET:?}).
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          set -e
          cd ~/apps/contabilidade-workspace

          if [ -z "$JWT_SECRET" ]; then
            echo "::error::Secret JWT_SECRET não configurado em Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "==> Baixando as últimas alterações..."
          git fetch origin main
          git reset --hard origin/main

          echo "==> Reconstruindo os containers com Docker Compose..."
          docker compose build

          echo "==> Subindo o banco e aplicando migrations..."
          docker compose up -d --wait postgres
          sh docker/postgres/migrate.sh

          docker compose up -d

          echo "==> Limpando imagens antigas sem uso..."
          docker image prune -f

          echo "==> Deploy concluído com sucesso!"
