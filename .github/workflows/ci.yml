name: Deploy Automático Lorien

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Sincronizar repositório e reiniciar containers
        run: |
          set -e
          cd ~/apps/contabilidade-workspace
          
          echo "==> Baixando as últimas alterações..."
          git fetch origin main
          git reset --hard origin/main

          echo "==> Reconstruindo os containers com Docker Compose..."
          docker compose build
          docker compose up -d

          echo "==> Limpando imagens antigas sem uso..."
          docker image prune -f

          echo "==> Deploy concluído com sucesso!"
